[project]
name = "transactionguard"
version = "2.0.0"
description = "Versioned fraud-scoring platform: model registry, calibrated risk scores, reason codes and drift monitoring"
authors = [{ name = "Dattu" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn==1.9.1",
    "joblib>=1.3.0",
    "lightgbm>=4.0.0",
    "scipy>=1.10.0",
    "fastapi>=0.100.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "uvicorn>=0.23.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "httpx>=0.24.0",
    "mlflow>=2.5.0",
    "kaggle>=1.5.16"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
    "src"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"app/api.py" = ["B008"]
